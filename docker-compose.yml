services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memoize-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recollect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recollect}
      POSTGRES_DB: ${POSTGRES_DB:-recollect}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first boot of an empty volume.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recollect} -d ${POSTGRES_DB:-recollect}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
